<!DOCTYPE html>

    <title>之前的那些事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px 20px;
            color: #f1f1f1;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 35px;
            color: #f1f1f1;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .item img {
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.5);
        }
        @media (max-width: 600px) {
            /* 手机自动变成一行1张 */
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
