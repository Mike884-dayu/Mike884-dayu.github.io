<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>之前的那些事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px 20px;
            color: #f1f1f1;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 35px;
            color: #f1f1f1;
            font-size: 42px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .item img {
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: 0.2s;
        }
        .item img:hover{
            transform: scale(1.02);
        }
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .lightbox{
            position: fixed;
            inset:0;
            background: rgba(0,0,0,0.9);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .lightbox img{
            max-width:90%;
            max-height:90%;
            border-radius:8px;
        }
        .lightbox.active{
            display:flex;
        }
    </style>
</head>
<body>

        <img id="lbimg">
