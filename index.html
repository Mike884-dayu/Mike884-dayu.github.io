<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 50px 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            text-align: center;
        }
        h1 {
            color: #f1f1f1;
            margin-bottom: 14px;
        }
        .desc {
            color: #b0b0b0;
            font-size: 17px;
            margin-bottom: 30px;
        }
        img {
            max-width: 90%;
            border-radius: 14px;
            margin: 18px 0;
            box-shadow: 0 3px 12px rgba(0,0,0,0.5);
        }
        .footer-text {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>你好，欢迎来到我的主页 👋</h1>
        <p class="desc">这里用来存放我的照片和日常分享</p>

        <img src="n1.jpg" alt="第一张照片">
        <img src="n2.jpg" alt="第二张照片">

        <p class="footer-text">使用 GitHub Pages 搭建</p>
    </div>
</body>
</html>
